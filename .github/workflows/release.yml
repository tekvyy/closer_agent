name: Release

# Builds the app for macOS and Windows into a draft GitHub release, writes the
# `latest.json` that installed apps poll for updates, then publishes the release.
# Requires the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Platform and arch in every name, so publish-release can map bundles to platforms
  ASSET_NAME_PATTERN: "Closer_[version]_[platform]_[arch][setup][ext]"

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const fs = require("fs");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: process.env.TAG,
              body: fs.readFileSync(".github/release-notes.md", "utf8"),
              draft: true,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: "macOS ARM64 (Apple Silicon)"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: "macOS x64 (Intel)"
          - platform: windows-latest
            args: "--bundles nsis"
            name: "Windows x64"

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseAssetNamePattern: ${{ env.ASSET_NAME_PATTERN }}
          # Written once in publish-release; parallel builds would overwrite each other's entries
          uploadUpdaterJson: false
          retryAttempts: 1
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json and publish
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.create-release.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const tag = process.env.TAG;

            // Each updater bundle is uploaded with a matching .sig file
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id,
            });
            const platforms = {};
            for (const sig of assets.filter((asset) => asset.name.endsWith(".sig"))) {
              const bundle = sig.name.slice(0, -".sig".length);
              const os = /macos|darwin/i.test(bundle) ? "darwin" : /windows/i.test(bundle) ? "windows" : null;
              const arch = /aarch64|arm64/i.test(bundle) ? "aarch64" : /x64|x86_64|amd64/i.test(bundle) ? "x86_64" : null;
              if (!os || !arch) {
                core.warning(`Skipping ${sig.name}: can't tell its platform`);
                continue;
              }
              const { data } = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: sig.id,
                headers: { accept: "application/octet-stream" },
              });
              platforms[`${os}-${arch}`] = {
                signature: Buffer.from(data).toString("utf8").trim(),
                url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${bundle}`,
              };
            }

            const expected = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"];
            const missing = expected.filter((key) => !platforms[key]);
            if (missing.length > 0) {
              core.setFailed(`No updater bundle for: ${missing.join(", ")}`);
              return;
            }

            const latest = {
              version: tag.replace(/^v/, ""),
              pub_date: new Date().toISOString(),
              platforms,
            };
            const existing = assets.find((asset) => asset.name === "latest.json");
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id,
              name: "latest.json",
              data: JSON.stringify(latest, null, 2),
              headers: { "content-type": "application/json" },
            });

            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });
            core.info(`Published ${tag} for ${Object.keys(platforms).join(", ")}`);
